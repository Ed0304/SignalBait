[project]
name = "signalbait"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "transformers",
    "torch==2.9.1",
    "paddleocr",
    "paddlepaddle",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" }
]

[tool.uv]
override-dependencies = [
    "opencv-python==4.10.0.84",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true